<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111322" />
    <title>Atelier — commandes à préparer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b5e6b'/%3E%3Cpath d='M3 5.5h10v6H3z' fill='none' stroke='%23fff' stroke-width='1.2'/%3E%3Cpath d='M3 5.8l5 3.4 5-3.4' fill='none' stroke='%23fff' stroke-width='1.2'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/workspace.css" />
  </head>
  <body>
    <div id="gate" class="gate" hidden>
      <h1 data-t="gate.title">Lien invalide</h1>
      <p id="gate-error"></p>
      <p data-t="gate.help">Demandez au marchand de vous renvoyer votre lien d'accès.</p>
    </div>

    <div class="wsapp" id="app" hidden>
      <!-- Navigation. Colonne à gauche sur ordinateur, barre d'onglets fixée
           en bas sur téléphone : l'appareil est tenu d'une main pendant qu'on
           emballe de l'autre, et le pouce n'atteint jamais le haut de l'écran. -->
      <nav class="wsnav" id="ws-nav" aria-label="Sections">
        <div class="wsnav-brand">
          <span class="wsnav-mark" aria-hidden="true">◧</span>
          <span>
            <b data-t="head.crumb">Atelier</b>
            <small id="ws-supplier"></small>
          </span>
        </div>

        <button type="button" data-view="orders" aria-current="true">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3" y="4.5" width="14" height="11" rx="2" />
            <path d="M3 8.5h14M8 8.5v7" />
          </svg>
          <span data-t="nav.orders">Commandes</span>
        </button>

        <button type="button" data-view="tracking">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 2.8 17 6.4v7.2L10 17.2 3 13.6V6.4z" />
            <path d="M3 6.4 10 10m0 0 7-3.6M10 10v7.2" />
          </svg>
          <span data-t="nav.tracking">Suivi</span>
        </button>

        <button type="button" data-view="catalog">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <rect x="3" y="3.5" width="6" height="6" rx="1.4" />
            <rect x="11" y="3.5" width="6" height="6" rx="1.4" />
            <rect x="3" y="11" width="6" height="6" rx="1.4" />
            <rect x="11" y="11" width="6" height="6" rx="1.4" />
          </svg>
          <span data-t="nav.catalog">Catalogue</span>
        </button>

        <button type="button" data-view="updates">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M11 2.5 4.5 11.2h4.2L9 17.5l6.5-8.7h-4.2z" />
          </svg>
          <span data-t="nav.updates">Changements</span>
          <span class="wsnav-badge" id="ws-badge" hidden>0</span>
        </button>

        <!-- Réglages rarement touchés, donc rangés en bas : la langue se
             choisit une fois, l'export se prend une fois par jour. -->
        <div class="wsnav-foot">
          <div class="ws-lang" id="ws-lang" role="group" aria-label="Langue"></div>
        </div>
      </nav>

      <main class="wsmain">
        <!-- ============================================ COMMANDES ======= -->
        <section id="view-orders">
          <header class="wshead">
            <h1 id="ws-title" data-t="head.title">Commandes à préparer</h1>
            <div class="wshead-acts">
              <button class="ico" id="ws-reload" type="button" title="Actualiser"
                aria-label="Actualiser">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <path d="M16.5 10a6.5 6.5 0 1 1-2-4.7" />
                  <path d="M16.5 3v3.5H13" />
                </svg>
              </button>
              <button class="ico" id="ws-more" type="button" title="Dates et export"
                aria-expanded="false" aria-label="Dates et export">
                <svg viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="4.5" cy="10" r="1.4" />
                  <circle cx="10" cy="10" r="1.4" />
                  <circle cx="15.5" cy="10" r="1.4" />
                </svg>
              </button>
            </div>
          </header>

          <!-- La période en un geste. Les dates précises et les exports vivent
               derrière « … » : ils servent une fois par jour, la période à
               chaque ouverture. -->
          <div class="seg" id="ws-quick" role="group">
            <button type="button" data-range="yesterday" data-t="range.yesterday">Hier</button>
            <button type="button" data-range="today" data-t="range.today">Aujourd'hui</button>
            <button type="button" data-range="week" data-t="range.week">7 jours</button>
          </div>

          <div class="ws-drawer" id="ws-drawer" hidden>
            <label class="ws-range">
              <span data-t="head.from">Du</span> <input type="date" id="ws-since" />
            </label>
            <label class="ws-range">
              <span data-t="head.to">au</span> <input type="date" id="ws-until" />
            </label>
            <a class="btn btn-primary" id="ws-xlsx" download data-t="head.xlsx">Télécharger .xlsx</a>
            <a class="btn" id="ws-csv" download data-t="head.csv">CSV</a>
          </div>

          <!-- Alertes urgentes du marchand. Après la période, avant les
               commandes : elles existent pour interrompre le travail en cours. -->
          <div id="ws-alerts"></div>

          <!-- Avancement de la journée. La question entre deux colis n'est pas
               « combien y en a-t-il » mais « où j'en suis ». -->
          <div class="ws-progress" id="ws-progress" hidden>
            <span id="ws-progress-text"></span>
            <div class="ws-progress-bar"><i id="ws-progress-fill"></i></div>
          </div>

          <div class="chips" id="ws-filter" role="group">
            <button type="button" data-filter="left" aria-pressed="true">
              <span data-t="filter.left">À préparer</span>
              <b id="count-left">0</b>
            </button>
            <button type="button" data-filter="all">
              <span data-t="filter.all">Toutes</span>
              <b id="count-all">0</b>
            </button>
            <!-- Regrouper par modèle : quinze paires du même article
                 s'emballent d'affilée dans le même carton. Un interrupteur,
                 pas un menu — il n'y a que deux ordres possibles. -->
            <button type="button" class="chip-sort" id="ws-sort" aria-pressed="false">
              <span data-t="sort.model">Par modèle</span>
            </button>
          </div>

          <div id="ws-orders"></div>
        </section>

        <!-- ============================================= SUIVI =========== -->
        <section id="view-tracking" hidden>
          <header class="wshead">
            <h1 data-t="tracking.title">Colis enregistrés</h1>
          </header>
          <label class="ws-search-wrap">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="9" cy="9" r="5.6" /><path d="m13.2 13.2 3.4 3.4" />
            </svg>
            <input type="search" id="track-q" data-tph="tracking.search"
              placeholder="Numéro de suivi ou commande" />
          </label>
          <div id="track-rows"></div>
        </section>

        <!-- =========================================== CATALOGUE ========= -->
        <section id="view-catalog" hidden>
          <header class="wshead">
            <h1 data-t="catalog.title">Catalogue</h1>
          </header>
          <label class="ws-search-wrap" id="catalog-search" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="9" cy="9" r="5.6" /><path d="m13.2 13.2 3.4 3.4" />
            </svg>
            <input type="search" id="catalog-q" data-tph="catalog.search"
              placeholder="Modèle ou marque" />
          </label>
          <div id="catalog-rows"></div>
        </section>

        <!-- =========================================== CHANGEMENTS ======= -->
        <section id="view-updates" hidden>
          <header class="wshead">
            <h1 data-t="updates.title">Demandes de changement</h1>
          </header>
          <div id="updates-rows"></div>
        </section>
      </main>
    </div>

    <div class="modal-wrap" id="issue-modal">
      <div class="modal">
        <div class="modal-head">
          <h2 data-t="issue.title">Signaler un problème</h2>
          <p id="issue-order"></p>
        </div>
        <div class="modal-body">
          <label class="field">
            <span data-t="issue.kind">Nature du problème</span>
            <select id="issue-kind">
              <option value="PHONE" data-t="issue.kind.PHONE">Numéro de téléphone incomplet ou invalide</option>
              <option value="ADDRESS" data-t="issue.kind.ADDRESS">Adresse incomplète ou incorrecte</option>
              <option value="STOCK" data-t="issue.kind.STOCK">Article indisponible</option>
              <option value="DAMAGE" data-t="issue.kind.DAMAGE">Article abîmé</option>
              <option value="OTHER" data-t="issue.kind.OTHER">Autre problème</option>
            </select>
          </label>

          <!-- Détail de l'article, pour une rupture. Replié tant que la nature
               n'est pas « indisponible » : demander la taille pour un téléphone
               erroné ferait renoncer au signalement. -->
          <div id="issue-item" hidden>
            <label class="field">
              <span data-t="issue.product">Modèle</span>
              <input id="issue-product" type="text" data-tph="issue.productHint" placeholder="Ex. : Nike Mind 001" />
            </label>
            <div class="field-row">
              <label class="field">
                <span data-t="issue.color">Couleur</span>
                <input id="issue-color" type="text" placeholder="Black Hyper Crimson" />
              </label>
              <label class="field">
                <span data-t="issue.size">Taille</span>
                <input id="issue-size" type="text" placeholder="45" />
              </label>
              <label class="field">
                <span data-t="issue.qty">Quantité</span>
                <input id="issue-qty" type="number" min="1" max="999" value="1" />
              </label>
            </div>
            <label class="field">
              <span data-t="issue.sku">Référence (SKU)</span>
              <input id="issue-sku" type="text" placeholder="NIK-MIND001-BLK-45" />
            </label>
          </div>

          <label class="field">
            <span data-t="issue.note">Détail</span>
            <textarea id="issue-note" rows="4" data-tph="issue.noteHint"
              placeholder="Ex. : le numéro fait 8 chiffres, il en manque un."></textarea>
          </label>
        </div>
        <div class="modal-foot">
          <button class="btn" id="issue-cancel" data-t="issue.cancel">Annuler</button>
          <button class="btn btn-primary" id="issue-send" data-t="issue.send">Envoyer au marchand</button>
        </div>
      </div>
    </div>

    <!-- Lecture du code-barres de l'étiquette. La caméra plein cadre, un seul
         bouton : viser suffit, la détection ferme l'écran toute seule. -->
    <div class="modal-wrap" id="scan-modal">
      <div class="modal modal-scan">
        <div class="modal-head">
          <h2 data-t="scan.title">Scanner le code-barres</h2>
          <p data-t="scan.hint">Visez le code-barres de l'étiquette.</p>
        </div>
        <video id="scan-video" playsinline muted></video>
        <div class="modal-foot">
          <button class="btn" id="scan-cancel" data-t="scan.cancel">Annuler</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/static/workspace.js"></script>
  </body>
</html>
