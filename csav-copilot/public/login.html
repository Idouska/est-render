<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Connexion — cSAV Copilot</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="gate">
      <!-- Le logo de l'outil, comme l'icône d'une app au-dessus de son
           écran de connexion. -->
      <img class="gate-logo" src="/static/logo.svg" width="64" height="64" alt="cSAV Copilot" />
      <h1>Connexion</h1>

      <a class="btn btn-google" href="/auth/google/login">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/>
          <path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        Se connecter avec Google
      </a>
      <p class="empty" id="google-msg" hidden style="margin-top: 10px"></p>

      <div class="gate-ou"><span>ou recevoir un lien par mail</span></div>

      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" autocomplete="email" placeholder="vous@boutique.fr" />
      </div>

      <div class="actions" style="margin-top: 14px">
        <button class="btn btn-primary" id="go">Recevoir le lien</button>
      </div>

      <p class="empty" id="result" hidden style="margin-top: 16px"></p>

      <p class="empty" style="margin-top: 22px">
        Vous êtes le propriétaire de la boutique et vous n'avez pas encore installé
        l'application&nbsp;? Passez par votre administration Shopify.
      </p>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);

      // Le retour de Google, quand il n'a pas pu ouvrir de session.
      const MESSAGES_GOOGLE = {
        refuse: 'Connexion Google annulée.',
        echec: 'Google n’a pas pu confirmer votre adresse. Réessayez, ou recevez un lien par mail.',
        inconnu:
          'Aucun compte actif ne porte cette adresse Google. Utilisez l’adresse sur laquelle vous avez été invité, ou demandez une invitation au propriétaire.',
      };
      const retourGoogle = new URLSearchParams(location.search).get('google');
      if (MESSAGES_GOOGLE[retourGoogle]) {
        $('google-msg').textContent = MESSAGES_GOOGLE[retourGoogle];
        $('google-msg').hidden = false;
        history.replaceState(null, '', '/login');
      }

      async function request() {
        const email = $('email').value.trim();
        if (!email) return;

        const button = $('go');
        button.disabled = true;
        button.textContent = 'Envoi…';

        try {
          const response = await fetch('/api/auth/request-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          const payload = await response.json().catch(() => null);

          // Toujours le même message, compte existant ou non : l'inverse
          // transformerait cette page en annuaire des employés du marchand.
          $('result').textContent =
            payload?.message ?? 'Si un compte existe pour cette adresse, un lien vient d’être envoyé.';
          $('result').hidden = false;
        } catch {
          $('result').textContent = 'Envoi impossible pour le moment. Réessayez dans un instant.';
          $('result').hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = 'Recevoir le lien';
        }
      }

      $('go').addEventListener('click', request);
      $('email').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') request();
      });
    </script>
  </body>
</html>
