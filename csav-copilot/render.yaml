# Déploiement Render — trois processus sur la même image Docker, plus une base
# PostgreSQL et un Redis.
#
# Utilisation : Render → New → Blueprint → sélectionner ce dépôt.
# Les variables marquées `sync: false` sont à saisir dans l'interface après la
# première création : ce sont des secrets, ils n'ont rien à faire dans le dépôt.
#
# Les identifiants de plateforme (clés Shopify, Google, IA) peuvent aussi se
# régler depuis la console d'administration `/admin`, qui prime sur ce fichier
# et évite un redéploiement à chaque rotation de clé. Ce qui est déclaré ici
# reste le repli. Voir docs/11-console-admin.md.
#
# Le champ `rootDir` suppose que le projet est dans le sous-dossier
# `csav-copilot`. À retirer si vous déplacez le projet à la racine du dépôt.
#
# `region: frankfurt` place l'ensemble dans l'Union européenne. Sans ce champ,
# Render déploie en Oregon : les mails de clients français partiraient aux
# États-Unis, ce qui vous obligerait à documenter un transfert hors UE dans le
# contrat de sous-traitance signé avec chaque marchand. Tous les services et la
# base doivent partager la même région, sinon ils ne se voient pas sur le
# réseau privé.

databases:
  - name: csav-db
    databaseName: csav
    user: csav
    plan: basic-256mb
    region: frankfurt

services:
  # --- API + dashboard -------------------------------------------------------
  - type: web
    name: csav-api
    runtime: docker
    rootDir: csav-copilot
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health

    # Domaine propre du SAV.
    #
    # Déclaré ici plutôt que cliqué dans l'interface Render : un domaine posé
    # à la main disparaît au prochain environnement recréé depuis ce fichier,
    # et personne ne se souvient de le remettre. Render demande le certificat
    # dès que l'enregistrement DNS pointe sur lui.
    #
    # L'ancienne adresse continue de répondre : les liens de travail déjà
    # transmis aux fournisseurs la portent en dur, et les couper au moment où
    # l'on gagne une jolie URL serait un mauvais échange.
    domains:
      - sav.runningupscale.com

    # Les migrations tournent avant la bascule du trafic, une seule fois par
    # déploiement — surtout pas au démarrage de chaque processus.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        sync: false # https://csav-api.onrender.com une fois l'URL connue
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: csav-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: csav-redis
          type: keyvalue
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_orders,read_customers,read_fulfillments,write_orders,read_products,read_inventory
      - key: SHOPIFY_API_VERSION
        value: '2025-01'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_SCOPES
        value: https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.compose,https://www.googleapis.com/auth/gmail.send
      - key: GOOGLE_PUBSUB_TOPIC
        sync: false
      - key: GOOGLE_PUBSUB_SERVICE_ACCOUNT
        sync: false
      # Mot de passe de la console d'administration (/admin), 12 caractères
      # minimum. Absent, la console est désactivée et les identifiants
      # ci-dessous restent lus uniquement depuis ces variables.
      # Génération : node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))"
      # Seul le service web en a besoin : le worker et le cron n'exposent
      # aucune interface HTTP.
      - key: ADMIN_PASSWORD
        sync: false
      # Fournisseur d'IA : "anthropic" ou "deepseek". Réglable aussi depuis la
      # console d'administration, qui prime sur cette valeur — voir
      # docs/11-console-admin.md et docs/09-fournisseur-ia.md.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1

  # --- Workers : classification, rédaction, ingestion ------------------------
  - type: worker
    name: csav-worker
    runtime: docker
    rootDir: csav-copilot
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    dockerCommand: node dist/worker.js
    envVars:
      # ENCRYPTION_KEY doit être identique à celle de l'API : les workers
      # déchiffrent les mêmes tokens. `fromService` la recopie, ne la
      # redéclarez pas avec `generateValue`.
      - key: ENCRYPTION_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          name: csav-api
          type: web
          envVarKey: APP_URL
      - key: DATABASE_URL
        fromDatabase:
          name: csav-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: csav-redis
          type: keyvalue
          property: connectionString
      - key: SHOPIFY_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: SHOPIFY_API_KEY
      - key: SHOPIFY_API_SECRET
        fromService:
          name: csav-api
          type: web
          envVarKey: SHOPIFY_API_SECRET
      - key: SHOPIFY_SCOPES
        value: read_orders,read_customers,read_fulfillments,write_orders,read_products,read_inventory
      - key: SHOPIFY_API_VERSION
        value: '2025-01'
      - key: GOOGLE_CLIENT_ID
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_CLIENT_SECRET
      - key: GOOGLE_SCOPES
        value: https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.compose,https://www.googleapis.com/auth/gmail.send
      - key: GOOGLE_PUBSUB_TOPIC
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_PUBSUB_TOPIC
      - key: GOOGLE_PUBSUB_SERVICE_ACCOUNT
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_PUBSUB_SERVICE_ACCOUNT
      - key: ANTHROPIC_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AI_PROVIDER
        fromService:
          name: csav-api
          type: web
          envVarKey: AI_PROVIDER
      - key: DEEPSEEK_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: DEEPSEEK_API_KEY
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1

  # --- Tâches planifiées : watch Gmail + purge RGPD --------------------------
  # Sans ce cron, l'écoute Gmail expire au bout de 7 jours et l'ingestion
  # s'arrête sans aucune erreur visible.
  - type: cron
    name: csav-cron
    runtime: docker
    rootDir: csav-copilot
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    schedule: '0 4 * * *' # tous les jours à 4 h UTC
    dockerCommand: node dist/cron.js
    envVars:
      - key: ENCRYPTION_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: NODE_ENV
        value: production
      - key: APP_URL
        fromService:
          name: csav-api
          type: web
          envVarKey: APP_URL
      - key: DATABASE_URL
        fromDatabase:
          name: csav-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: csav-redis
          type: keyvalue
          property: connectionString
      - key: SHOPIFY_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: SHOPIFY_API_KEY
      - key: SHOPIFY_API_SECRET
        fromService:
          name: csav-api
          type: web
          envVarKey: SHOPIFY_API_SECRET
      - key: SHOPIFY_SCOPES
        value: read_orders,read_customers,read_fulfillments,write_orders,read_products,read_inventory
      - key: SHOPIFY_API_VERSION
        value: '2025-01'
      - key: GOOGLE_CLIENT_ID
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_CLIENT_SECRET
      - key: GOOGLE_SCOPES
        value: https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.compose,https://www.googleapis.com/auth/gmail.send
      - key: GOOGLE_PUBSUB_TOPIC
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_PUBSUB_TOPIC
      - key: GOOGLE_PUBSUB_SERVICE_ACCOUNT
        fromService:
          name: csav-api
          type: web
          envVarKey: GOOGLE_PUBSUB_SERVICE_ACCOUNT
      - key: ANTHROPIC_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: ANTHROPIC_API_KEY
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AI_PROVIDER
        fromService:
          name: csav-api
          type: web
          envVarKey: AI_PROVIDER
      - key: DEEPSEEK_API_KEY
        fromService:
          name: csav-api
          type: web
          envVarKey: DEEPSEEK_API_KEY
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1

  # --- File d'attente --------------------------------------------------------
  - type: keyvalue
    name: csav-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction # BullMQ ne tolère pas la perte de jobs
    ipAllowList: [] # accessible uniquement depuis les services Render
