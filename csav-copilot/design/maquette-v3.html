<title>cSAV Copilot — poste de travail</title>

<style>
  /* ===================================================== palettes ====== */

  :root {
    --accent: #6c5ce7;
    --accent-strong: #5b4bd6;
    --accent-soft: #efedfe;
    --accent-ink: #4c3fc4;
    --on-accent: #ffffff;
    --frame: #6d5ae6;
  }

  /* Répété en sélecteur d'attribut pour que les vignettes de la galerie
     puissent porter la palette par défaut comme les sept autres. */
  [data-accent="violet"] {
    --accent: #6c5ce7; --accent-strong: #5b4bd6; --accent-soft: #efedfe;
    --accent-ink: #4c3fc4; --on-accent: #ffffff; --frame: #6d5ae6;
  }

  [data-accent="indigo"] {
    --accent: #4f46e5; --accent-strong: #4338ca; --accent-soft: #eceafd;
    --accent-ink: #3f37bd; --on-accent: #ffffff; --frame: #4f46e5;
  }
  [data-accent="bleu"] {
    --accent: #2563eb; --accent-strong: #1d4ed8; --accent-soft: #e8f0fe;
    --accent-ink: #1d4ed8; --on-accent: #ffffff; --frame: #2f6fe4;
  }
  [data-accent="cyan"] {
    --accent: #0891b2; --accent-strong: #0e7490; --accent-soft: #e0f5fa;
    --accent-ink: #0e7490; --on-accent: #ffffff; --frame: #0e9ec2;
  }
  [data-accent="emeraude"] {
    --accent: #059669; --accent-strong: #047857; --accent-soft: #e0f5ee;
    --accent-ink: #047857; --on-accent: #ffffff; --frame: #0aa473;
  }
  [data-accent="ambre"] {
    --accent: #d97706; --accent-strong: #b45309; --accent-soft: #fdf0dd;
    --accent-ink: #b45309; --on-accent: #ffffff; --frame: #e08a1e;
  }
  [data-accent="corail"] {
    --accent: #e11d48; --accent-strong: #be123c; --accent-soft: #fdeaef;
    --accent-ink: #be123c; --on-accent: #ffffff; --frame: #e63b60;
  }
  [data-accent="graphite"] {
    --accent: #475569; --accent-strong: #334155; --accent-soft: #eef1f5;
    --accent-ink: #334155; --on-accent: #ffffff; --frame: #526175;
  }

  /* ======================================================= thèmes ====== */

  :root {
    --ground: #f4f4f7;
    --surface: #ffffff;
    --sunk: #fafafc;
    --inset: #f5f5f8;
    --ink: #14141b;
    --ink-soft: #4a4a5c;
    --ink-mute: #83839a;
    --line: #e9e9f0;
    --line-soft: #f1f1f6;

    --ok: #059669; --ok-soft: #e3f6ef;
    --warn: #d97706; --warn-soft: #fdf1de;
    --crit: #e5484d; --crit-soft: #fdeaea;

    --age-0: #10b981; --age-1: #f59e0b; --age-2: #f97316; --age-3: #ef4444;

    --r-lg: 15px;
    --r-md: 11px;
    --r-sm: 9px;

    --shadow-card: 0 1px 2px rgba(20, 20, 40, 0.04), 0 12px 28px -20px rgba(20, 20, 40, 0.3);
    --shadow-pop: 0 8px 32px -8px rgba(20, 20, 40, 0.22), 0 2px 8px rgba(20, 20, 40, 0.06);

    --f-ui: "Segoe UI Variable Display", "SF Pro Display", system-ui, -apple-system,
      "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --f-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    color-scheme: light;
  }

  [data-theme="dark"] {
    --ground: #14161c;
    --surface: #1b1e26;
    --sunk: #20242d;
    --inset: #232733;
    --ink: #eef0f5;
    --ink-soft: #b3b8c6;
    --ink-mute: #848b9d;
    --line: #2b303b;
    --line-soft: #242832;

    --ok-soft: #102c23; --warn-soft: #2d2313; --crit-soft: #331d1e;
    --accent-soft: color-mix(in srgb, var(--accent) 20%, #1b1e26);
    --accent-ink: color-mix(in srgb, var(--accent) 62%, #ffffff);

    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 30px -20px rgba(0, 0, 0, 0.8);
    --shadow-pop: 0 10px 34px -8px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.35);

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  /* `hidden` est masqué par la feuille du navigateur via `display: none`, ce
     qu'une règle d'auteur comme `.work { display: grid }` écrase en silence. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--frame);
    font-family: var(--f-ui);
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    transition: background 0.25s ease;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, body { transition: none !important; animation: none !important; }
  }

  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

  /* ======================================================== shell ====== */

  .frame { padding: 26px; }

  @media (max-width: 700px) { .frame { padding: 10px; } }

  .app {
    background: var(--ground);
    border-radius: 20px;
    padding: 13px;
    display: grid;
    grid-template-columns: 244px 1fr;
    gap: 13px;
    max-width: 1580px;
    margin: 0 auto;
    min-height: 88vh;
    transition: background 0.2s ease;
  }

  @media (max-width: 1080px) { .app { grid-template-columns: 1fr; } }

  /* ====================================================== sidebar ====== */

  .side {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 15px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  @media (max-width: 1080px) { .side { display: none; } }

  .logo { display: flex; align-items: center; gap: 11px; padding: 2px 4px; }

  .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: linear-gradient(150deg, var(--accent), var(--accent-strong));
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.02em;
    flex: none;
  }

  .logo b { display: block; font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .logo span { display: block; font-size: 11.5px; color: var(--ink-mute); }

  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--inset);
    color: var(--ink-mute);
    font-size: 13px;
  }

  .search svg { width: 15px; height: 15px; flex: none; }
  .search kbd {
    margin-left: auto;
    font-family: var(--f-ui);
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid var(--line);
  }

  .nav-group + .nav-group { margin-top: 15px; }

  .nav-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 0 8px 7px;
    margin: 0;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 9px;
    border: 0;
    border-radius: var(--r-sm);
    background: none;
    font: inherit;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .nav-item svg { width: 17px; height: 17px; flex: none; opacity: 0.75; }
  .nav-item:hover { background: var(--inset); color: var(--ink); }

  .nav-item.on {
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .nav-item.on svg { opacity: 1; }

  .nav-item .tally {
    margin-left: auto;
    font-family: var(--f-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--crit-soft);
    color: var(--crit);
  }

  .me {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px 2px;
    border-top: 1px solid var(--line-soft);
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: linear-gradient(150deg, var(--accent), var(--accent-strong));
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-size: 12.5px;
    font-weight: 600;
    flex: none;
  }

  .me b { display: block; font-size: 13px; font-weight: 600; }
  .me span { display: block; font-size: 11.5px; color: var(--ink-mute); }

  /* ========================================================= main ====== */

  .main { display: flex; flex-direction: column; gap: 13px; min-width: 0; }

  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 2px 0; }

  .crumb {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--ink-mute);
  }

  .crumb svg { width: 15px; height: 15px; }

  .head h1 {
    width: 100%;
    margin: 0;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.025em;
    text-wrap: balance;
  }

  .head-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .btn {
    appearance: none;
    font: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: border-color 0.12s ease, background 0.12s ease;
  }

  .btn:hover { border-color: var(--ink-mute); }
  .btn svg { width: 15px; height: 15px; }

  .btn-main {
    background: linear-gradient(150deg, var(--accent), var(--accent-strong));
    border-color: transparent;
    color: var(--on-accent);
    font-weight: 600;
    box-shadow: 0 4px 14px -6px var(--accent);
  }

  .btn-main:hover { border-color: transparent; filter: brightness(1.05); }

  .btn-danger { color: var(--crit); border-color: var(--crit-soft); background: var(--crit-soft); }

  /* sélecteur de palette */

  .palette-wrap { position: relative; }

  .dot-row { display: flex; gap: 3px; }
  .dot-row i { width: 9px; height: 9px; border-radius: 50%; display: block; }

  .pop {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    z-index: 20;
    width: 268px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-pop);
    padding: 14px;
  }

  .pop[hidden] { display: none; }

  .pop h4 {
    margin: 0 0 10px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .swatch {
    appearance: none;
    border: 2px solid transparent;
    border-radius: var(--r-sm);
    background: var(--inset);
    padding: 7px 4px 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 10px;
    color: var(--ink-mute);
    transition: border-color 0.12s ease;
  }

  .swatch i {
    width: 24px;
    height: 24px;
    border-radius: 8px;
    display: block;
    box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.12);
  }

  .swatch[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }

  .pop-sep { height: 1px; background: var(--line-soft); margin: 13px 0; }

  .seg {
    display: grid;
    grid-auto-flow: column;
    gap: 5px;
    padding: 4px;
    background: var(--inset);
    border-radius: var(--r-md);
  }

  .seg button {
    appearance: none;
    font: inherit;
    font-size: 12.5px;
    padding: 6px 10px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--ink-mute);
    cursor: pointer;
  }

  .seg button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(20, 20, 40, 0.1);
  }

  /* ===================================================== workspace ===== */

  .work { display: grid; grid-template-columns: 356px 1fr; gap: 13px; align-items: start; min-width: 0; }

  @media (max-width: 1240px) { .work { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-card);
  }

  .queue-top { padding: 13px 13px 11px; border-bottom: 1px solid var(--line-soft); }

  .tally-line {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 10px;
  }

  .tally-line b { color: var(--ink); font-weight: 600; }

  .rows { list-style: none; margin: 0; padding: 7px; max-height: 66vh; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }

  .row {
    appearance: none;
    font: inherit;
    text-align: left;
    width: 100%;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    background: none;
    color: inherit;
    padding: 10px 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: background 0.12s ease, border-color 0.12s ease;
  }

  .row:hover { background: var(--inset); }

  .row[aria-current="true"] {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 32%, transparent);
  }

  .row-top { display: flex; align-items: center; gap: 8px; }

  .row-num {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.01em;
  }

  .age {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--f-mono);
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--age);
    background: color-mix(in srgb, var(--age) 14%, transparent);
  }

  .age::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--age); }

  .row-what { font-size: 13.5px; font-weight: 600; line-height: 1.35; letter-spacing: -0.01em; }

  .row-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  .tag {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }

  .tag-client { background: var(--accent-soft); color: var(--accent-ink); }
  .tag-fournisseur { background: var(--warn-soft); color: var(--warn); }
  .tag-litige { background: var(--crit-soft); color: var(--crit); }
  .tag-todo { background: var(--crit-soft); color: var(--crit); }
  .tag-wait { background: var(--warn-soft); color: var(--warn); }
  .tag-done { background: var(--ok-soft); color: var(--ok); }

  .row-who { font-size: 12px; color: var(--ink-mute); }

  .thumbs { display: flex; gap: 4px; }

  .thumb {
    width: 27px;
    height: 27px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: grid;
    place-items: center;
    flex: none;
  }

  .thumb svg { width: 18px; height: 18px; }

  /* ======================================================== fiche ====== */

  .sheet { display: flex; flex-direction: column; gap: 13px; min-width: 0; }

  .sheet-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    flex-wrap: wrap;
    padding: 16px 17px;
  }

  .sheet-num {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .sheet-sub { font-size: 12.5px; color: var(--ink-mute); margin-top: 4px; }

  .sect { padding: 15px 17px; }
  .sect + .sect { border-top: 1px solid var(--line-soft); }

  .sect h3 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .field-label {
    font-size: 12px;
    color: var(--ink-mute);
    margin: 0 0 6px;
  }

  .inset {
    background: var(--inset);
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    padding: 12px 13px;
  }

  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 11px; }

  .control {
    width: 100%;
    font: inherit;
    font-size: 13.5px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
  }

  .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 10px; }

  .opt {
    appearance: none;
    font: inherit;
    font-size: 13px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
  }

  .opt:hover { border-color: var(--ink-mute); }

  .opt[aria-pressed="true"] {
    background: linear-gradient(150deg, var(--accent), var(--accent-strong));
    border-color: transparent;
    color: var(--on-accent);
    font-weight: 600;
    box-shadow: 0 4px 14px -7px var(--accent);
  }

  .opt.danger[aria-pressed="true"] {
    background: var(--crit-soft);
    border-color: var(--crit);
    color: var(--crit);
    box-shadow: none;
  }

  .quote {
    background: var(--inset);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-md);
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    white-space: pre-wrap;
  }

  .quote-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    color: var(--ink-mute);
    margin-bottom: 7px;
  }

  .quote-head b { color: var(--ink); font-size: 13px; font-weight: 600; }

  .subs { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; }

  .sub {
    appearance: none;
    font: inherit;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.12s ease;
  }

  .sub:hover { border-color: var(--accent); }

  .sub[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .sub-photo {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: grid;
    place-items: center;
    flex: none;
  }

  .sub-photo svg { width: 24px; height: 24px; }
  .sub b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.25; }
  .sub span { display: block; font-size: 11px; color: var(--ok); }

  .items { display: flex; flex-direction: column; gap: 9px; }

  .item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 11px;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-md);
    background: var(--inset);
  }

  .item.bad { border-color: color-mix(in srgb, var(--crit) 45%, transparent); background: var(--crit-soft); }

  .item-photo {
    width: 42px;
    height: 42px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    display: grid;
    place-items: center;
    flex: none;
  }

  .item-photo svg { width: 29px; height: 29px; }
  .item b { display: block; font-size: 13px; font-weight: 600; }

  .item-var { font-size: 12px; color: var(--ink-mute); display: flex; align-items: center; gap: 6px; }

  .sw { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.2); flex: none; }

  .item-qty { margin-left: auto; font-family: var(--f-mono); font-size: 13px; color: var(--ink-mute); }

  .kv { display: flex; align-items: baseline; gap: 12px; font-size: 13px; }
  .kv + .kv { margin-top: 8px; }
  .kv dt { color: var(--ink-mute); flex: none; }
  .kv dd { margin: 0 0 0 auto; text-align: right; }

  /* suivi */

  .leg { display: grid; grid-template-columns: 16px 1fr auto; gap: 11px; padding-bottom: 15px; position: relative; }
  .leg:last-child { padding-bottom: 0; }

  .leg::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 15px;
    bottom: 0;
    width: 2px;
    background: var(--line);

    {

      what: 'Retour — mauvaise finition commandée', kind: 'return',
      who: 'Inès Lambert', mail: 'ines.lambert@free.fr', total: '42,50 €',
      addr: '12 boulevard Gambetta, 06000 Nice', placed: '4 juil. 2026',
      items: [{ n: 'Ampoule E27 ambrée', v: null, hex: '#e8c88a', q: 3, bulb: true }],
      track: { no: 'LP00298330445CN', by: 'Cainiao · Colissimo', leg: 5,
        dates: ['5 juil.', '7 juil.', '10 juil.', '11 juil.', '13 juil.', '15 juil.'] },
      from: 'Inès Lambert', at: 'il y a 4 jours',
      msg: "Je me suis trompée de finition, comment faire pour l'échanger ?",
    },
  ];

  const LEGS = [
    ['Pris en charge par le fournisseur', 'Shenzhen, CN'],
    ['Transit à l’export', 'Aéroport de Shenzhen (SZX)'],
    ['Transit à l’import', 'Aéroport de Paris-CDG'],
    ['Dédouanement', 'Douane française'],
    ['En cours de livraison', 'Transporteur local'],
    ['Livré', 'Remis au client'],
  ];

  const SUBS = [
    { n: 'Lampe Perce-neige', v: 'Noir mat', hex: '#2b2b2b', s: '42 en stock' },
    { n: 'Lampe Perce-neige', v: 'Cuivre brossé', hex: '#a5673f', s: '18 en stock' },
    { n: 'Lampe Congère', v: 'Laiton', hex: '#b08d3f', s: '7 en stock' },
  ];

  const EVENTS = [
    ['Message du fournisseur reçu', 'Rupture signalée sur la référence Laiton', "Aujourd'hui, 08:14", 'var(--age-3)'],
    ['Suivi mis à jour', 'Transit à l’export — Aéroport de Shenzhen', 'Hier, 14:02', 'var(--accent)'],
    ['Commande rattachée', 'Rapprochée par l’adresse du client', '28 juil., 09:45', 'var(--age-0)'],
  ];

  const ageVar = (d) => (d < 1 ? 'var(--age-0)' : d <= 2 ? 'var(--age-1)' : d <= 4 ? 'var(--age-2)' : 'var(--age-3)');
  const ageText = (d) => (d < 1 ? "aujourd'hui" : d === 1 ? '1 jour' : `${d} jours`);

  let selected = '10428';
  let action = null;

  /* ------------------------------------------------------------- rendu */

  function renderRows() {
    $('rows').innerHTML = ORDERS.map(
      (o) => `<li><button class="row" data-id="${o.id}" aria-current="${o.id === selected}"
        style="--age: ${ageVar(o.days)}">
        <span class="row-top">
          <span class="row-num">#${o.id}</span>
          <span class="tag tag-${o.st}">${ST[o.st]}</span>
          <span class="age">${ageText(o.days)}</span>
        </span>
        <span class="row-what">${esc(o.what)}</span>
        <span class="row-meta">
          <span class="tag tag-${o.src}">${SRC[o.src]}</span>
          <span class="row-who">${esc(o.who)}</span>
          <span class="thumbs" style="margin-left:auto">
            ${o.items.map((i) => `<span class="thumb">${pic(i)}</span>`).join('')}
          </span>
        </span>
      </button></li>`,
    ).join('');

    $('rows').querySelectorAll('.row').forEach((b) =>
      b.addEventListener('click', () => {
        selected = b.dataset.id;
        action = null;
        renderRows();
        renderSheet();
      }),
    );
  }

  function actionsFor(o) {
    const list = [];
    if (o.kind === 'stock' || o.kind === 'color') list.push(['sub', 'Substitution'], ['refund', 'Rembourser']);
    if (o.kind === 'address') list.push(['address', "Corriger l'adresse"]);
    if (o.kind === 'email') list.push(['email', "Corriger l'email"]);
    if (o.kind === 'refund') list.push(['refund', 'Rembourser']);
    if (o.kind === 'dispute') list.push(['evidence', 'Répondre à Shopify']);
    list.push(['client', 'Écrire au client'], ['supplier', 'Écrire au fournisseur']);
    return list;
  }

  function paneFor(o, key) {
    if (key === 'sub')
      return `<p class="field-label">Le client garde sa commande, on remplace la référence indisponible.</p>
        <div class="subs">
          ${SUBS.map(
            (s, i) => `<button class="sub" aria-pressed="${i === 0}">
              <span class="sub-photo">${LAMP(s.hex)}</span>
              <span><b>${esc(s.n)}<br />${esc(s.v)}</b><span>${esc(s.s)}</span></span>
            </button>`,
          ).join('')}
        </div>`;

    if (key === 'refund')
      return `<div class="inset">
          <dl style="margin:0">
            <div class="kv"><dt>Montant payé</dt><dd class="mono">${esc(o.total)}</dd></div>
            <div class="kv"><dt>Remboursable</dt><dd class="mono">${esc(o.total)}</dd></div>
          </dl>
        </div>
        <p class="note" style="margin:10px 0 0">Confirmation obligatoire, consignée au journal d'audit.</p>`;

    if (key === 'address')
      return `<p class="field-label">Corrigée ici, l'adresse part vers Shopify et vers le fournisseur en une fois.</p>
        <input class="control" value="${esc(o.addr)}" />`;

    if (key === 'email')
      return `<p class="field-label">L'adresse actuelle rebondit. La corriger relance l'envoi du suivi.</p>
        <input class="control" value="${esc(o.mail)}" />`;

    if (key === 'evidence')
      return `<p class="field-label">Le suivi 17TRACK et l'adresse sont joints automatiquement.</p>
        <div class="inset">
          <dl style="margin:0">
            <div class="kv"><dt>Preuve de suivi</dt><dd class="mono">${esc(o.track ? o.track.no : '—')}</dd></div>
            <div class="kv"><dt>Statut colis</dt><dd>${o.track ? LEGS[o.track.leg][0] : '—'}</dd></div>
          </dl>
        </div>`;

    if (key === 'client')
      return `<textarea class="control" rows="4" placeholder="Votre réponse au client…"></textarea>
        <p class="note" style="margin:9px 0 0">Part depuis sav@atelier-lumen.fr, dans le fil d'origine.</p>`;

    return `<textarea class="control" rows="4" placeholder="Votre message au fournisseur…"></textarea>
      <p class="note" style="margin:9px 0 0">Shenzhen Lumi — réponse moyenne sous 14 h.</p>`;
  }

  function renderSheet() {
    const o = ORDERS.find((x) => x.id === selected);
    const acts = actionsFor(o);
    const current = action ?? acts[0][0];

    $('sheet').innerHTML = `
      <div class="card">
        <div class="sheet-head">
          <div>
            <div class="sheet-num">#${o.id}</div>
            <div class="sheet-sub">${esc(o.who)} · ${esc(o.mail)}</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <span class="tag tag-${o.st}">${ST[o.st]}</span>
            <div class="sheet-sub" style="margin-top:6px">
              Ouvert depuis <b style="color:${ageVar(o.days)}">${ageText(o.days)}</b>
            </div>
          </div>
        </div>

        <div class="sect">
          <h3>Problème signalé</h3>
          ${o.deadline ? `<p class="field-label" style="color:var(--crit);font-weight:600">${esc(o.deadline)}</p>` : ''}
          <div class="quote-head"><b>${esc(o.from)}</b><span>${esc(o.at)}</span></div>
          <div class="quote">${esc(o.msg)}</div>
        </div>

        <div class="sect">
          <h3>Action</h3>
          <div class="options" style="margin-bottom:14px">
            ${acts
              .map(
                ([k, label]) => `<button class="opt${k === 'refund' ? ' danger' : ''}"
                  data-act="${k}" aria-pressed="${k === current}">${esc(label)}</button>`,
              )
              .join('')}
          </div>
          <div id="pane">${paneFor(o, current)}</div>
        </div>

        <div class="foot">
          <button class="btn">Marquer résolu</button>
          <button class="btn btn-main">Valider et envoyer</button>
        </div>
      </div>

      <div class="card">
        <div class="sect">
          <h3>Commande</h3>
          <div class="items">
            ${o.items
              .map(
                (i) => `<div class="item${i.bad ? ' bad' : ''}">
                  <span class="item-photo">${pic(i)}</span>
                  <span>
                    <b>${esc(i.n)}</b>
                    <span class="item-var">
                      ${i.v ? `<span class="sw" style="background:${i.hex}"></span>${esc(i.v)}` : 'Sans variante'}
                    </span>
                  </span>
                  <span class="item-qty">×${i.q}</span>
                </div>`,
              )
              .join('')}
          </div>
          <div class="inset" style="margin-top:12px">
            <dl style="margin:0">
              <div class="kv"><dt>Passée le</dt><dd class="mono">${esc(o.placed)}</dd></div>
              <div class="kv"><dt>Montant</dt><dd class="mono">${esc(o.total)}</dd></div>
              <div class="kv"><dt>Livraison</dt><dd>${esc(o.addr)}</dd></div>
            </dl>
          </div>
        </div>

        <div class="sect">
          <h3>Suivi 17TRACK</h3>
          ${
            o.track
              ? `<div class="inset" style="margin-bottom:14px">
                  <dl style="margin:0">
                    <div class="kv"><dt>Transporteur</dt><dd>${esc(o.track.by)}</dd></div>
                    <div class="kv"><dt>N° de suivi</dt><dd class="mono">${esc(o.track.no)}</dd></div>
                  </dl>
                </div>
                ${LEGS.map(([t, p], i) => {
                  const cls = i < o.track.leg ? 'done' : i === o.track.leg ? 'now' : 'todo';
                  return `<div class="leg ${cls}">
                    <span class="bead"></span>
                    <span><span class="t">${t}</span><br /><span class="p">${p}</span></span>
                    <span class="d">${o.track.dates[i] ?? ''}</span>
                  </div>`;
                }).join('')}`
              : `<p class="note">Aucun numéro de suivi : le colis n'a jamais été expédié.</p>`
          }
        </div>

        <div class="sect">
          <h3>Historique</h3>
          <div class="events">
            ${EVENTS.map(
              ([t, d, when, c]) => `<div class="event" style="--c:${c}">
                <i></i><span><b>${esc(t)}</b> — ${esc(d)}</span><time>${esc(when)}</time>
              </div>`,
            ).join('')}
          </div>
        </div>
      </div>`;

    $('sheet').querySelectorAll('.opt').forEach((b) =>
      b.addEventListener('click', () => {
        action = b.dataset.act;
        renderSheet();
      }),
    );

    bindSubs();
  }

  function bindSubs() {
    const subs = $('sheet').querySelectorAll('.sub');
    subs.forEach((b) =>
      b.addEventListener('click', () => {
        subs.forEach((s) => s.setAttribute('aria-pressed', String(s === b)));
      }),
    );
  }

  /* ------------------------------------------------------------ galerie */

  function renderGallery() {
    $('gallery').innerHTML =
      `<p class="gallery-note">Les huit palettes sont livrées dans le produit : chaque agent
        choisit la sienne dans Réglages, le choix est enregistré sur son compte.
        Clique sur une vignette pour l'appliquer.</p>` +
      PALETTES.map(
        (p) => `<button class="tile" data-accent="${p.key}" data-key="${p.key}"
          aria-pressed="${p.key === accent}">
          <span class="tile-app">
            <span class="tile-inner">
              <span class="tile-bar">
                <span class="tile-mark">cS</span>
                <span class="tile-name">cSAV Copilot</span>
                <span class="tile-btn">Escalade</span>
              </span>
              <span class="tile-row sel">
                <span class="tile-num">#10428</span>
                <span class="tile-age" style="--age: var(--age-3)">6 j</span>
                <span class="tile-what">Couleur Laiton en rupture</span>
              </span>
              <span class="tile-row">
                <span class="tile-num">#10391</span>
                <span class="tile-age" style="--age: var(--age-2)">4 j</span>
                <span class="tile-what">Adresse incomplète</span>
              </span>
              <span class="tile-opts">
                <span class="tile-opt on">Substitution</span>
                <span class="tile-opt">Rembourser</span>
              </span>
              <span class="tile-track">
                <i class="done"></i><i class="now"></i><i></i><i></i>
                <span>Transit à l’export</span>
              </span>
            </span>
          </span>
          <span class="tile-foot">
            <span class="tile-swatch"></span>
            <b>${esc(p.name)}</b>
            <code>${esc(p.hex)}</code>
          </span>
        </button>`,
      ).join('');

    $('gallery').querySelectorAll('.tile').forEach((t) =>
      t.addEventListener('click', () => {
        setAccent(t.dataset.key);
        setMode('one');
      }),
    );
  }

  function setMode(mode) {
    $('gallery').hidden = mode !== 'all';
    document.querySelector('.work').hidden = mode === 'all';
    $('mode-seg').querySelectorAll('button').forEach((b) =>
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode)),
    );
    if (mode === 'all') renderGallery();
  }

  $('mode-seg').querySelectorAll('button').forEach((b) =>
    b.addEventListener('click', () => setMode(b.dataset.mode)),
  );

  setAccent('violet');
  document.documentElement.dataset.theme = 'light';
  renderRows();
  renderSheet();
</script>
