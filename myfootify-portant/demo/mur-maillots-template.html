<title>Mur Maillots</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<style>
/* Mise en page : un mur de casiers sombres plein cadre, un maillot par casier ; le clic fait avancer la caméra vers le casier, la fiche se pose autour. */
:root {
  color-scheme: dark;
  --wall: #26262a;
  --wall-deep: #17171a;
  --ink: #f0ede8;
  --muted: #a6a29b;
  --line: rgba(240, 237, 232, .16);
  --orange: #ff6a00;
  --orange-soft: #ff9a4d;
  --display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --body: 'Archivo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
html, body { height: 100%; }
body { background: var(--wall-deep); color: var(--ink); font-family: var(--body); font-size: 15px; display: flex; flex-direction: column; }
.bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-block: 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--display); font-stretch: 112%; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; font-size: 15px; }
.brand b { color: var(--orange); font-weight: 800; }
.bag { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bag strong { color: var(--ink); font-weight: 600; }

.stage { position: relative; flex: 1; min-height: 420px; overflow: hidden; background: radial-gradient(90% 70% at 50% 30%, #3a3a3f 0%, var(--wall) 55%, var(--wall-deep) 100%); isolation: isolate; }
.stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: linear-gradient(180deg, rgba(0,0,0,.28), transparent 18%, transparent 80%, rgba(0,0,0,.45)); }

.wall { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .95s cubic-bezier(.65, 0, .2, 1); will-change: transform; }
.intro { position: absolute; left: 4%; top: 5%; z-index: 2; transition: opacity .3s; }
.intro p { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; }
.intro h1 { margin: 6px 0 0; font-family: var(--display); font-stretch: 118%; font-weight: 800; text-transform: uppercase; font-size: clamp(20px, 2.6vw, 38px); line-height: 1.02; letter-spacing: -.3px; text-wrap: balance; }
.intro h1 em { font-style: normal; color: var(--orange); }

.slot { position: absolute; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; display: block; -webkit-tap-highlight-color: transparent; }
.slot::before { content: ''; position: absolute; inset: -7% -9% -3% -9%; border-radius: 3px; background: linear-gradient(180deg, #121214 0%, #1d1d20 55%, #19191b 100%); border: 1px solid rgba(255, 255, 255, .07); box-shadow: inset 0 22px 30px rgba(0, 0, 0, .65), 0 10px 22px rgba(0, 0, 0, .35); }
.slot img { position: absolute; left: 0; right: 0; bottom: 2%; width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 9px rgba(0, 0, 0, .5)); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 50% 0%; pointer-events: none; }
/* La tablette : une lame de verre, et sa réglette LED éteinte tant qu'on ne survole pas. */
.shelf { position: absolute; left: -5%; right: -5%; top: -6%; height: 1.4%; min-height: 3px; border-radius: 2px; background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.08)); box-shadow: 0 6px 14px rgba(0,0,0,.45); transition: background .3s, box-shadow .3s; }
.shelf::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 3200%; background: radial-gradient(70% 100% at 50% 0%, rgba(255, 130, 40, .42), transparent 72%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.slot:hover img, .slot:focus-visible img, .slot.is-on img { transform: scale(1.035); }
.slot:hover .shelf, .slot:focus-visible .shelf, .slot.is-on .shelf { background: linear-gradient(180deg, #ffd9b0, var(--orange)); box-shadow: 0 0 18px 2px rgba(255, 106, 0, .75), 0 6px 14px rgba(0,0,0,.45); }
.slot:hover .shelf::after, .slot:focus-visible .shelf::after, .slot.is-on .shelf::after { opacity: 1; }
.slot:focus-visible { outline: 2px solid var(--orange-soft); outline-offset: 6px; border-radius: 4px; }
.tag { position: absolute; left: -9%; right: -9%; top: 106%; text-align: center; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity .25s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot:hover .tag, .slot:focus-visible .tag { opacity: 1; }
.stage.is-zoom .tag, .stage.is-zoom .intro { opacity: 0; }
.stage.is-zoom .slot { cursor: default; }
.stage.is-zoom .slot:not(.is-on) { cursor: pointer; }

/* La fiche, posée par-dessus la scène zoomée. */
.sheet { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .35s; }
.stage.is-zoom .sheet { opacity: 1; transition-delay: .55s; }
.stage.is-zoom .sheet > * { pointer-events: auto; }
.name { position: absolute; left: 4%; top: 6%; max-width: 44%; }
.name small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; }
.name h2 { margin: 6px 0 0; font-family: var(--display); font-stretch: 118%; font-weight: 800; text-transform: uppercase; font-size: clamp(22px, 3vw, 44px); line-height: 1; letter-spacing: -.4px; text-wrap: balance; }
.name h2 span { color: var(--orange); }
.buy { position: absolute; right: 3%; top: 4%; width: min(310px, 32%); display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; background: rgba(20, 20, 22, .72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.price { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.price span { color: var(--muted); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }
.price strong { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.buy label { color: var(--muted); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; }
.sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sizes button { font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: rgba(20, 20, 22, .55); color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s; }
.sizes button:hover { border-color: var(--ink); }
.sizes button[aria-pressed="true"] { background: var(--ink); color: #17171a; border-color: var(--ink); font-weight: 700; }
.add { font: inherit; font-weight: 700; font-size: 15px; padding: 14px 18px; border-radius: 999px; border: 0; background: var(--orange); color: #fff; cursor: pointer; transition: transform .15s, background .15s; }
.add:hover { background: #ff7d1f; }
.add:active { transform: scale(.98); }
.add[disabled] { background: rgba(240, 237, 232, .14); color: var(--muted); cursor: not-allowed; }
.note { margin: 0; min-height: 1.3em; font-size: 12.5px; color: var(--orange-soft); }
.nav { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; }
.nav button { white-space: nowrap; font: inherit; font-size: 13px; color: var(--ink); background: rgba(20, 20, 22, .6); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.nav button:hover { border-color: var(--ink); }
.nav .arrow { width: 40px; padding-inline: 0; }
button:focus-visible { outline: 2px solid var(--orange-soft); outline-offset: 2px; }
.hint { position: absolute; left: 0; right: 0; bottom: 4%; z-index: 4; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; transition: opacity .3s; pointer-events: none; }
.stage.is-zoom .hint { opacity: 0; }

@media (max-width: 760px) {
  .intro { left: 5%; top: 2.5%; }
  .name { left: 5%; top: 3%; max-width: 90%; }
  .name h2 { font-size: 24px; }
  .buy { left: 5%; right: 5%; top: auto; bottom: 74px; width: auto; gap: 10px; padding: 14px; border-radius: 16px; background: rgba(20, 20, 22, .72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .sizes { grid-template-columns: repeat(5, 1fr); }
  .sizes button { font-size: 12px; padding: 7px 0; }
  .nav { bottom: 16px; }
  .hint { bottom: 2%; }
}
@media (prefers-reduced-motion: reduce) {
  .wall, .slot img, .sheet, .shelf { transition: none !important; }
}
</style>

<div class="bar">
  <div class="brand">My<b>Footify</b></div>
  <div class="bag">Panier&nbsp;: <strong id="bag-count">0</strong> article<span id="bag-s"></span></div>
</div>

<div class="stage" id="stage">
  <div class="wall" id="wall">
    <div class="intro">
      <p>Saison 2026/27 · 59,90&nbsp;€</p>
      <h1>Choisis ton <em>maillot.</em></h1>
    </div>
  </div>

  <div class="sheet" id="sheet" aria-live="polite">
    <div class="name">
      <small id="s-kicker">Nike Mind 001</small>
      <h2 id="s-name"></h2>
    </div>
    <div class="buy">
      <div class="price"><span>Prix</span><strong id="s-price"></strong></div>
      <label id="size-label">Taille</label>
      <div class="sizes" id="sizes" role="group" aria-labelledby="size-label"></div>
      <button class="add" id="add" type="button" disabled>Choisis ta taille</button>
      <p class="note" id="note"></p>
    </div>
    <div class="nav">
      <button class="arrow" id="prev" type="button" aria-label="Maillot précédent">‹</button>
      <button id="flip" type="button" aria-pressed="false">Voir le dos</button>
      <button id="close" type="button">Retour au mur</button>
      <button class="arrow" id="next" type="button" aria-label="Maillot suivant">›</button>
    </div>
  </div>
  <div class="hint" id="hint">Clique sur un maillot</div>
</div>

<script>
const SHOES = /*DATA*/;
const stage = document.getElementById('stage');
const wall = document.getElementById('wall');
const $ = (id) => document.getElementById(id);
let current = -1, size = null, bag = 0;
const narrow = () => stage.clientWidth < 760;

// Les emplacements sont en % du mur : 5 × 2 sur grand écran, 2 × 5 sur téléphone.
function place() {
  const cols = narrow() ? 2 : 5, rows = Math.ceil(SHOES.length / cols);
  const padX = narrow() ? 7 : 5, top = narrow() ? 11 : 21, bottom = narrow() ? 7 : 12;
  const cellW = (100 - 2 * padX) / cols, cellH = (100 - top - bottom) / rows;
  const W = stage.clientWidth, H = stage.clientHeight;
  slots.forEach((el, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const w = cellW * (narrow() ? 0.7 : 0.72);
    const hPx = Math.min((w / 100) * W / SHOES[i].ratio * 1.12, (cellH / 100) * H * 0.74);
    const wPx = Math.min((w / 100) * W, hPx / 1.12 * SHOES[i].ratio);
    el.style.width = wPx + 'px';
    el.style.height = hPx + 'px';
    el.style.left = (padX + cellW * (c + 0.5)) / 100 * W - wPx / 2 + 'px';
    el.style.top = (top + cellH * (r + 1)) / 100 * H - hPx - (cellH / 100) * H * 0.1 + 'px';
  });
  if (current >= 0) zoom(current, true);
}

const slots = SHOES.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'slot'; b.type = 'button';
  b.setAttribute('aria-label', s.title + ', ' + s.price);
  b.innerHTML = '<img alt="" src="' + s.img + '"><span class="shelf"></span><span class="tag">' + s.color + '</span>';
  b.addEventListener('click', () => zoom(i));
  wall.appendChild(b);
  return b;
});

function zoom(i, instant) {
  const el = slots[i], W = stage.clientWidth, H = stage.clientHeight;
  const w = el.offsetWidth, h = el.offsetHeight;
  const s = narrow() ? Math.min((W * 0.74) / w, (H * 0.4) / h) : Math.min((W * 0.4) / w, (H * 0.66) / h);
  const cx = el.offsetLeft + w / 2, cy = el.offsetTop + h / 2;
  const tx = W * (narrow() ? 0.5 : 0.46) - cx * s, ty = H * (narrow() ? 0.33 : 0.52) - cy * s;
  if (instant) { wall.style.transition = 'none'; requestAnimationFrame(() => (wall.style.transition = '')); }
  wall.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  slots.forEach((o, k) => o.classList.toggle('is-on', k === i));
  stage.classList.add('is-zoom');
  if (current !== i) { if (current >= 0) face(current, false); current = i; size = null; fill(); }
}
function unzoom() {
  wall.style.transform = '';
  stage.classList.remove('is-zoom');
  slots.forEach((o) => o.classList.remove('is-on'));
  const back = current; if (back >= 0) face(back, false); current = -1;
  if (back >= 0) slots[back].focus({ preventScroll: true });
}
function face(i, back) { slots[i].querySelector('img').src = back ? SHOES[i].back : SHOES[i].img; if (i === current || !back) { $('flip').textContent = back ? 'Voir la face' : 'Voir le dos'; $('flip').setAttribute('aria-pressed', String(back)); } }
function fill() {
  const s = SHOES[current];
  $('s-name').innerHTML = s.color.replace(/^(\S+)/, '<span>$1</span>');
  $('s-kicker').textContent = s.line;
  $('s-price').textContent = s.price;
  $('note').textContent = '';
  $('sizes').innerHTML = '';
  s.sizes.forEach((v) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = v.replace('.', ','); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      size = v;
      [...$('sizes').children].forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
      $('add').disabled = false; $('add').textContent = 'Ajouter au panier';
      $('note').textContent = '';
    });
    $('sizes').appendChild(b);
  });
  $('add').disabled = true; $('add').textContent = 'Choisis ta taille';
}
$('add').addEventListener('click', () => {
  bag += 1;
  $('bag-count').textContent = bag; $('bag-s').textContent = bag > 1 ? 's' : '';
  $('note').textContent = SHOES[current].color + ', taille ' + size + ' : ajouté (démo, rien n’est commandé).';
});
$('close').addEventListener('click', unzoom);
$('flip').addEventListener('click', () => face(current, $('flip').getAttribute('aria-pressed') !== 'true'));
$('prev').addEventListener('click', () => zoom((current - 1 + SHOES.length) % SHOES.length));
$('next').addEventListener('click', () => zoom((current + 1) % SHOES.length));
document.addEventListener('keydown', (e) => {
  if (current < 0) return;
  if (e.key === 'Escape') unzoom();
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});
stage.addEventListener('click', (e) => { if (current >= 0 && (e.target === stage || e.target === wall)) unzoom(); });
if (matchMedia('(hover: none)').matches) $('hint').textContent = 'Touche un maillot';
new ResizeObserver(place).observe(stage);
place();
</script>
